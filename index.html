<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15171B">
<title>O'Caisse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --ground:#E9ECF1;--paper:#FFFFFF;--paper-2:#F4F5F8;--ink:#15171B;--ink-2:#434852;--muted:#646B77;
  --line:#D6DAE1;--line-2:#E6E9EE;
  --orange:#E06A1B;--blue:#1374BA;--red:#E0433A;--gold:#EFA11B;
  --ok:#137A43;--ok-bg:#E2F3E9;--bad:#BE2F28;--bad-bg:#FBE6E4;--warn:#8F5B00;--warn-bg:#FFF1D1;
  --ink-salon:#B24F0E;--ink-snack:#B5261E;
  --accent:var(--orange);--accent-ink:var(--ink-salon);--pole-a:var(--orange);--pole-b:var(--blue);
  --radius:16px;
  --shadow:0 1px 2px rgba(21,23,27,.06),0 12px 32px rgba(21,23,27,.14);
  --font:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --display:"Alfa Slab One","Rockwell","Roboto Slab",Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0D0F13;--paper:#171A20;--paper-2:#1F232B;--ink:#F1F3F5;--ink-2:#C9CDD4;--muted:#959CA8;
    --line:#2C313A;--line-2:#232730;
    --orange:#F07A2A;--blue:#3F96DA;--red:#F05A4F;--gold:#F5B13B;
    --ok:#46C983;--ok-bg:#133222;--bad:#FF7066;--bad-bg:#3B1714;--warn:#F4C45A;--warn-bg:#382B0D;
    --ink-salon:#FF9D5C;--ink-snack:#FF8A80;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 14px 36px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0D0F13;--paper:#171A20;--paper-2:#1F232B;--ink:#F1F3F5;--ink-2:#C9CDD4;--muted:#959CA8;
  --line:#2C313A;--line-2:#232730;
  --orange:#F07A2A;--blue:#3F96DA;--red:#F05A4F;--gold:#F5B13B;
  --ok:#46C983;--ok-bg:#133222;--bad:#FF7066;--bad-bg:#3B1714;--warn:#F4C45A;--warn-bg:#382B0D;
  --ink-salon:#FF9D5C;--ink-snack:#FF8A80;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 14px 36px rgba(0,0,0,.55);
  color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3{margin:0}
.muted{color:var(--muted)}
.grow{flex:1}
.nowrap{white-space:nowrap}
.num{font-variant-numeric:tabular-nums}

.shell{--accent-ink:color-mix(in srgb,var(--accent) 74%,#000)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .shell{--accent-ink:color-mix(in srgb,var(--accent) 62%,#fff)}}
:root[data-theme="dark"] .shell{--accent-ink:color-mix(in srgb,var(--accent) 62%,#fff)}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:11px 16px;font:700 16px/1.15 var(--font);cursor:pointer;min-height:48px;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn-accent{background:var(--accent);border-color:transparent;color:#fff}
.btn-danger{background:var(--bad);border-color:transparent;color:#fff}
.btn-ghost{background:transparent;border-color:transparent}
.btn-lg{min-height:58px;font-size:18px;padding:14px 22px}
.btn-block{width:100%}
.linkish{background:none;border:0;padding:6px 2px;color:var(--accent-ink);font:600 15px var(--font);text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* Signature : le bouton « enseigne de barbier » */
.pole{position:relative;overflow:hidden;isolation:isolate;background:#15171B;color:#fff;border:1px solid #15171B;min-height:60px;font-size:19px;padding-left:40px;border-radius:14px}
.pole::before{content:"";position:absolute;left:0;top:0;bottom:0;width:26px;z-index:-1;
  background-image:linear-gradient(45deg,var(--pole-a) 0 17%,#fff 17% 25%,var(--pole-b) 25% 42%,#fff 42% 50%,var(--pole-a) 50% 67%,#fff 67% 75%,var(--pole-b) 75% 92%,#fff 92% 100%);
  background-size:44px 44px;transition:width .25s ease}
.pole.busy::before{width:100%;animation:pole .7s linear infinite}
.pole .pole-label{position:relative;border-radius:8px;padding:4px 10px;transition:background .2s}
.pole.busy .pole-label{background:#15171B}
.pole:disabled::before{filter:grayscale(1);opacity:.6}
@keyframes pole{to{background-position:0 44px}}
:root[data-theme="dark"] .pole{border-color:#3A404A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pole{border-color:#3A404A}}

/* ---------- Chips / segmented ---------- */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:9px 15px;font:600 15px/1 var(--font);white-space:nowrap;cursor:pointer;min-height:42px;display:inline-flex;align-items:center;gap:8px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .av{width:26px;height:26px;font-size:11px}
.chip.need{border-color:var(--bad);animation:nudge .4s}
@keyframes nudge{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.seg{display:inline-flex;background:var(--paper-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:none;padding:8px 12px;border-radius:9px;font:600 15px var(--font);color:var(--ink-2);white-space:nowrap;cursor:pointer;min-height:38px}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* ---------- Avatars / badges ---------- */
.av{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;color:#fff;font:700 13px/1 var(--font);flex:none;letter-spacing:.3px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font:700 12px/1.3 var(--font);background:var(--paper-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.badge.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.badge.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.badge.salon{color:var(--ink-salon)}
.badge.snack{color:var(--ink-snack)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}

/* ---------- Boot / lock / setup ---------- */
.boot{flex:1;display:grid;place-items:center;text-align:center;padding:24px}
.boot p{color:var(--muted)}
.lock{flex:1;display:grid;grid-template-columns:1fr;grid-template-rows:auto 1fr;min-height:0;overflow:auto}
@media(min-width:900px){.lock{grid-template-columns:minmax(320px,42%) 1fr;grid-template-rows:1fr}}
.lock-brand{position:relative;background:#15171B;color:#fff;padding:26px 96px 24px 24px;display:flex;flex-direction:column;justify-content:flex-end;min-height:200px;overflow:hidden;isolation:isolate}
@media(min-width:900px){.lock-brand{padding:40px 140px 44px 44px}}
.lock-pole{position:absolute;top:-10px;bottom:-10px;right:26px;width:46px;border-radius:24px;z-index:-1;
  background-image:linear-gradient(45deg,#E06A1B 0 17%,#fff 17% 25%,#1374BA 25% 42%,#fff 42% 50%,#E06A1B 50% 67%,#fff 67% 75%,#1374BA 75% 92%,#fff 92% 100%);
  background-size:52px 52px;animation:pole 3.2s linear infinite}
@media(min-width:900px){.lock-pole{right:48px;width:64px;border-radius:32px}}
@media (prefers-reduced-motion:reduce){.lock-pole,.pole.busy::before{animation:none}}
.wordmark{font-family:var(--display);font-size:clamp(40px,8vw,70px);line-height:.98;letter-spacing:.5px}
.wordmark .o1{color:color-mix(in srgb,var(--wm,#E06A1B) 82%,#fff)}
.wordmark .o2{color:#F05A4F}
.wm-2{font-size:clamp(30px,5.6vw,50px);margin-top:4px}
.lock-sub{margin:14px 0 0;color:#B9BEC7;font-size:16px}
.lock-pane{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px 16px 30px;gap:18px;text-align:center}
.lock-title{font:700 24px/1.2 var(--font)}
.lock-pane p{max-width:40ch;margin:0}
.pin-dots{display:flex;gap:16px;min-height:20px}
.pin-dots i{width:17px;height:17px;border-radius:50%;border:2px solid var(--ink-2)}
.pin-dots i.on{background:var(--ink);border-color:var(--ink)}
.keypad{display:grid;grid-template-columns:repeat(3,78px);gap:12px}
.key{height:66px;border-radius:18px;border:1px solid var(--line);background:var(--paper);font:600 27px var(--font);color:var(--ink);cursor:pointer}
.key:active{background:var(--paper-2);transform:scale(.97)}
.key-del{font-size:22px;color:var(--ink-2)}
.shake{animation:shake .38s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.lock-help{font-size:14px;color:var(--muted)}
.demo-codes{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:14px;max-width:360px}

/* ---------- Shell ---------- */
.shell{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-areas:"banner" "top" "main" "tabs"}
@media(min-width:900px){.shell{grid-template-columns:92px minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);grid-template-areas:"tabs banner" "tabs top" "tabs main"}}
.demo-banner{grid-area:banner;background:var(--warn-bg);color:var(--warn);font-weight:600;font-size:14px;padding:6px 14px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.demo-banner .linkish{color:var(--warn);padding:0}
.topbar{grid-area:top;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;background:var(--paper);border-bottom:1px solid var(--line);min-height:58px}
.tb-left,.tb-right{display:flex;align-items:center;gap:10px;min-width:0}
.tb-mark{width:14px;height:34px;border-radius:7px;flex:none;
  background-image:linear-gradient(45deg,var(--pole-a) 0 17%,#fff 17% 25%,var(--pole-b) 25% 42%,#fff 42% 50%,var(--pole-a) 50% 67%,#fff 67% 75%,var(--pole-b) 75% 92%,#fff 92% 100%);background-size:20px 20px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.tb-name{font-family:var(--display);font-weight:400;font-size:21px;color:var(--accent-ink);white-space:nowrap}
.seg-com button{font-family:var(--display);font-weight:400;font-size:16px;letter-spacing:.2px;padding:8px 12px}
.seg-com button[aria-pressed="true"]{color:var(--accent-ink)}
.op-chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;color:var(--ink);font:600 15px var(--font);min-height:44px;max-width:190px}
.op-chip .op-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:420px){.op-chip .op-name{display:none}.op-chip{padding:4px}}
.sync-pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 11px;font:600 13px var(--font);color:var(--ink-2);cursor:pointer;min-height:36px;white-space:nowrap}
.sync-pill i{width:9px;height:9px;border-radius:50%;background:var(--ok)}
.sync-pill.busy i{background:var(--blue);animation:blink 1s infinite}
.sync-pill.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.sync-pill.warn i{background:var(--warn)}
.sync-pill.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.sync-pill.bad i{background:var(--bad)}
.sync-pill.demo i{background:var(--gold)}
@media(max-width:520px){.sync-pill.ok span,.sync-pill.demo span{display:none}.sync-pill.ok,.sync-pill.demo{padding:6px 9px}}
@keyframes blink{50%{opacity:.3}}
.main{grid-area:main;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.main.is-pos{overflow:hidden}
.tabs{grid-area:tabs;display:flex;background:var(--paper);border-top:1px solid var(--line)}
@media(min-width:900px){.tabs{flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:12px 6px;gap:6px}}
.tab{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:7px 2px 8px;border:0;background:none;color:var(--muted);font:600 12.5px/1.1 var(--font);cursor:pointer;min-height:60px}
@media(min-width:900px){.tab{flex:none;min-height:72px;border-radius:14px}}
.tab-ico{display:grid;place-items:center;width:46px;height:30px;border-radius:15px}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--accent-ink)}
.tab[aria-current="page"] .tab-ico{background:rgba(224,106,27,.15);background:color-mix(in srgb,var(--accent) 17%,transparent)}
.tab-badge{position:absolute;top:5px;left:calc(50% + 8px);min-width:19px;height:19px;border-radius:10px;background:var(--bad);color:#fff;font:700 11px/19px var(--font);font-style:normal;padding:0 5px}

/* ---------- Caisse ---------- */
.pos{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
@media(min-width:900px){.pos{grid-template-columns:minmax(0,1fr) minmax(330px,390px);grid-template-rows:minmax(0,1fr)}}
.catalog{overflow:auto;padding:0 14px 18px;min-height:0}
.cats{position:sticky;top:0;z-index:2;background:var(--ground);padding:12px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:12px;min-height:122px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);cursor:pointer;color:var(--ink);font:inherit;overflow:hidden}
.tile:active{transform:scale(.97)}
.tile.in-cart{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tile-pic{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;font-size:29px;background:var(--paper-2);overflow:hidden;flex:none}
.tile-pic img{width:100%;height:100%;object-fit:cover;display:block}
.tile.has-photo{padding:0}
.tile.has-photo .tile-pic{width:100%;height:auto;aspect-ratio:4/3;border-radius:0}
.tile.has-photo .tile-name,.tile.has-photo .tile-price{padding:0 12px}
.tile.has-photo .tile-price{padding-bottom:11px}
.tile-name{font-weight:700;font-size:16.5px;line-height:1.15}
.tile-price{margin-top:auto;font-weight:700;color:var(--accent-ink);font-variant-numeric:tabular-nums;font-size:15px}
.qty-badge{position:absolute;top:8px;right:8px;background:var(--accent);color:#fff;border-radius:999px;min-width:28px;height:28px;display:grid;place-items:center;font:700 15px var(--font);padding:0 7px;box-shadow:0 0 0 3px var(--paper)}
.ticket{display:none}
@media(min-width:900px){.ticket{display:flex;flex-direction:column;min-height:0;background:var(--paper);border-left:1px solid var(--line)}}
.tk{display:flex;flex-direction:column;min-height:0;height:100%}
.tk-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
.tk-head h2{font:700 20px var(--font)}
.tk-who{padding:6px 16px 10px;border-bottom:1px solid var(--line-2)}
.tk-label{font-weight:600;font-size:14px;color:var(--ink-2);margin-bottom:7px}
.tk-lines{flex:1;overflow:auto;list-style:none;margin:0;padding:0 16px;min-height:80px}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line-2)}
.ln-name{font-weight:700}
.ln-name small{display:block;font-weight:500;color:var(--muted);font-size:14px}
.ln-total{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;grid-column:1;justify-self:start}
.stepper button{width:44px;height:40px;border:0;background:var(--paper-2);font:700 21px/1 var(--font);color:var(--ink);cursor:pointer}
.stepper span{min-width:36px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.tk-empty{padding:26px 6px;text-align:center;color:var(--muted)}
.tk-foot{padding:12px 16px 16px;border-top:1px solid var(--line)}
.total-row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;gap:10px}
.total-row span{font-weight:600;color:var(--ink-2)}
.total-row strong{font-family:var(--display);font-weight:400;font-size:34px;letter-spacing:.4px;font-variant-numeric:tabular-nums}
.tk-bar{display:flex;gap:10px;padding:10px 12px;background:var(--paper);border-top:1px solid var(--line)}
@media(min-width:900px){.tk-bar{display:none}}
.tk-bar-btn{flex:1;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;border:1px solid var(--line);background:var(--paper-2);border-radius:14px;padding:6px 14px;cursor:pointer;color:var(--ink);min-height:60px;text-align:left}
.tk-bar-btn span{font-size:14px;color:var(--ink-2);font-weight:600}
.tk-bar-btn strong{font-family:var(--display);font-weight:400;font-size:22px}
.tk-bar .pole{flex:1.2}
.closed{height:100%;overflow:auto;display:grid;place-items:center;padding:20px}
.closed-card{max-width:480px;width:100%;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:26px 24px;text-align:center;box-shadow:var(--shadow)}
.closed-card h1{font:700 25px/1.2 var(--font);margin:14px 0 8px}
.closed-card p{color:var(--ink-2);margin:0 0 20px}
.closed-mark{width:72px;height:72px;margin:0 auto;border-radius:20px;display:grid;place-items:center;background:var(--paper-2);font-size:36px}

/* ---------- Sheets ---------- */
#sheets{position:relative;z-index:50}
.sheet-wrap{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,10,14,.5);padding-top:calc(env(safe-area-inset-top,0px) + 16px)}
@media(min-width:700px){.sheet-wrap{align-items:center;padding:24px}}
.sheet{background:var(--paper);color:var(--ink);width:100%;max-width:560px;max-height:100%;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);animation:up .22s ease-out}
.sheet.wide{max-width:720px}
@media(min-width:700px){.sheet{border-radius:22px;padding-bottom:20px}}
@keyframes up{from{transform:translateY(26px);opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h2{font:700 22px/1.2 var(--font);margin:0 0 6px}
.sheet .sub{color:var(--muted);margin:0 0 12px}
.sheet-actions{display:flex;gap:10px;margin-top:18px;position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));background:var(--paper);padding:10px 0 2px}
@media(min-width:700px){.sheet-actions{bottom:-20px}}
.sheet-actions .grow{flex:1}
.field{display:flex;flex-direction:column;gap:6px;margin:14px 0}
.field>label,.field-label{font-weight:600;font-size:15px;color:var(--ink-2)}
.field .hint{font-size:13.5px;color:var(--muted)}
.input{width:100%;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:11px 14px;font:500 17px var(--font);min-height:50px}
textarea.input{min-height:110px;resize:vertical;line-height:1.35}
select.input{appearance:auto}
.input:focus{outline:3px solid rgba(19,116,186,.35);outline-offset:0;border-color:var(--blue)}
.input.amount{font:700 30px var(--font);font-variant-numeric:tabular-nums;letter-spacing:.3px}
.pin-input{letter-spacing:10px;font-weight:700;font-size:24px}
.check{display:flex;gap:12px;align-items:center;padding:10px 0;font-weight:600;cursor:pointer}
.check input{width:24px;height:24px;accent-color:var(--accent)}
.form-err{color:var(--bad);font-weight:600;min-height:1.2em;margin:6px 0 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pay-total{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:12px 16px;border-radius:16px;background:var(--paper-2);margin:8px 0 14px}
.pay-total span{font-weight:600;color:var(--ink-2)}
.pay-total strong{font-family:var(--display);font-weight:400;font-size:38px;letter-spacing:.4px}
.pay-total small{display:block;color:var(--muted);font-size:13.5px}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mode{display:flex;align-items:center;gap:10px;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:var(--paper);font:700 16px var(--font);color:var(--ink);cursor:pointer;min-height:58px;text-align:left}
.mode .dot{width:14px;height:14px}
.mode[aria-pressed="true"]{border-color:var(--ink);background:var(--paper-2)}
.change{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:14px 16px;border-radius:14px;background:var(--ok-bg);color:var(--ok);font-weight:700;margin-top:10px}
.change strong{font-size:28px;font-variant-numeric:tabular-nums}
.change.short{background:var(--bad-bg);color:var(--bad)}
details.more{margin-top:14px;border:1px solid var(--line);border-radius:14px;padding:4px 14px}
details.more summary{cursor:pointer;font-weight:700;padding:10px 0;color:var(--ink-2)}
.ok-mark{width:74px;height:74px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:40px;margin:6px auto 12px}
.success{text-align:center}
.success .big{font-family:var(--display);font-size:40px;margin:6px 0 2px}
.change-big{margin:14px 0 4px;padding:14px;border-radius:16px;background:var(--ok-bg);color:var(--ok);font-weight:700}
.change-big strong{display:block;font-family:var(--display);font-weight:400;font-size:42px}
.variants{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:10px}
.variant{min-height:74px;border:1px solid var(--line);border-radius:16px;background:var(--paper);font:700 22px var(--font);color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.variant small{display:block;font-size:13px;color:var(--muted);font-weight:600}
.variant:active{background:var(--paper-2)}
.emoji-row{display:flex;flex-wrap:wrap;gap:6px}
.emoji-row button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-size:24px;cursor:pointer}
.emoji-row button[aria-pressed="true"]{border-color:var(--ink);background:var(--paper-2)}
.photo-prev{width:120px;height:90px;border-radius:12px;object-fit:cover;border:1px solid var(--line)}

/* ---------- Pages ---------- */
.page{padding:16px 16px 32px;max-width:1120px;margin:0 auto}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.page-head h1{font:700 27px/1.15 var(--font)}
.page-head p{margin:4px 0 0}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.panel h2{font:700 18px/1.2 var(--font)}
.panel h2 .count{color:var(--muted);font-weight:600}
.cols{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:860px){.cols{grid-template-columns:1fr 1fr}.cols .panel{margin-bottom:0}}
.list{list-style:none;margin:0;padding:0}
.row-item{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line-2);cursor:pointer;color:var(--ink);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;font:inherit}
.list li:last-child .row-item{border-bottom:0}
.row-item .ri-main{flex:1;min-width:0}
.ri-main b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted);font-size:14px}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tno{font:700 13px var(--font);color:var(--muted);min-width:42px}
.annule .ri-main b,.annule .amt{text-decoration:line-through;color:var(--muted)}
.empty{padding:26px 12px;text-align:center;color:var(--muted)}
.notice{border-radius:14px;padding:12px 14px;background:var(--warn-bg);color:var(--warn);font-weight:600;margin-bottom:12px}
.notice.info{background:var(--paper-2);color:var(--ink-2);font-weight:500}
.sum-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:700px){.sum-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.sum{background:var(--paper-2);border-radius:14px;padding:12px 14px;min-width:0}
.sum span{display:block;font-size:14px;color:var(--ink-2);font-weight:600}
.sum b{font:700 22px/1.25 var(--font);font-variant-numeric:tabular-nums}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line-2)}
.kv:last-child{border-bottom:0}
.kv b{font-variant-numeric:tabular-nums}
.ecart-pos{color:var(--ok)} .ecart-neg{color:var(--bad)}

/* ---------- Rapports ---------- */
.rep-filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.rep-hero{background:#15171B;color:#fff;border-radius:22px;padding:20px 22px;margin-bottom:12px;position:relative;overflow:hidden}
.rep-hero .lbl{color:#B9BEC7;font-weight:600}
.hero-num{font-family:var(--display);font-size:clamp(42px,9vw,76px);line-height:1.02;letter-spacing:.5px;margin:4px 0 6px;font-variant-numeric:tabular-nums}
.delta{display:inline-flex;align-items:center;gap:6px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.1)}
.delta.up{color:#6EE0A0}.delta.down{color:#FF8E86}
.split{display:flex;height:12px;border-radius:6px;overflow:hidden;margin-top:16px;background:rgba(255,255,255,.12)}
.split i{display:block;height:100%}
.split-legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;color:#D5D9E0;font-size:14px}
.split-legend b{color:#fff}
.bars .bar-row{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0}
.bar-row .bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.bar{height:12px;background:var(--paper-2);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--accent)}
.hours{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));gap:4px;align-items:end;height:150px;padding-top:6px}
.hours .h{position:relative;height:100%;display:flex;align-items:flex-end}
.hours .h i{display:block;width:100%;background:var(--line);border-radius:5px 5px 0 0;min-height:2px}
.hours .h.eve i{background:var(--accent)}
.hours-axis{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));gap:4px;font-size:12px;color:var(--muted);text-align:center;margin-top:4px}
.big-note{font-size:17px;margin:10px 0 0}
.big-note b{color:var(--accent-ink)}
.tbl-wrap{overflow-x:auto;margin:0 -4px}
table.t{width:100%;border-collapse:collapse;font-size:15px}
.t th{font-size:13px;color:var(--muted);font-weight:700;text-align:left;padding:6px 6px;border-bottom:1px solid var(--line)}
.t td{padding:9px 6px;border-bottom:1px solid var(--line-2)}
.t tr:last-child td{border-bottom:0}
.t .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.t td.strong{font-weight:700}

/* ---------- Toasts ---------- */
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{background:#15171B;color:#fff;padding:11px 16px;border-radius:12px;font-weight:600;box-shadow:var(--shadow);transition:opacity .3s,transform .3s}
.toast.bad{background:var(--bad)}
.toast.warn{background:#8F5B00}
.toast.out{opacity:0;transform:translateY(-8px)}
.tk-sheet-body{margin:-6px -2px 0}
.tk-sheet-body .tk{height:auto}
.tk-sheet-body .tk-head{padding:0 2px 6px}
.tk-sheet-body .tk-who{padding:6px 2px 10px}
.tk-sheet-body .tk-lines{max-height:46vh;padding:0 2px}
.tk-sheet-body .tk-foot{padding:12px 2px 0}

/* ---------- V2 : activités, agenda, impression, installation ---------- */
.com-switch{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:6px 4px;cursor:pointer;color:var(--ink);font:inherit;min-height:44px}
.com-switch .tb-name{max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act-dot{display:inline-block;width:26px;height:26px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.chip .act-dot{width:22px;height:22px}
.menu-list{display:flex;flex-direction:column;margin:10px 0 6px;border-top:1px solid var(--line-2)}
.menu-list .row-item{min-height:56px}
.menu-list .row-item .meta{display:block;color:var(--muted);font-size:14px;margin-top:2px}
div.row-item.static{cursor:default}
.variants.choice{grid-template-columns:1fr 1fr}
.variants.choice .variant{font-size:18px;line-height:1.2;padding:16px 12px}
.variants.choice .variant small{margin-top:6px;font-size:13px}
.three{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:10px}
@media(max-width:420px){.three{grid-template-columns:1fr 1fr}.three .field:first-child{grid-column:1 / -1}}
.resa-time{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:58px;padding:6px 8px;border-radius:10px;background:var(--paper-2);font-variant-numeric:tabular-nums;line-height:1.15}
.resa-time b{font-size:17px}
.resa-time span{font-size:13px;color:var(--muted)}
.row-item .amt{text-align:right;font-weight:700;white-space:nowrap}
.resa-left{display:block;font-size:13px;font-weight:600;color:var(--warn)}
.z-preview{background:#fff;color:#111;border-radius:10px;padding:12px 10px;margin-top:10px;max-height:52vh;overflow:auto;box-shadow:inset 0 0 0 1px var(--line)}
.rc{font:500 12.5px/1.38 var(--font);color:#111;font-variant-numeric:tabular-nums;margin:0 auto}
.z-preview .rc{max-width:360px;font-size:14px}
.rc-c{text-align:center}
.rc-big{font-weight:800;font-size:1.18em;margin:2px 0}
.rc-b{font-weight:800;margin-top:2px}
.rc-row{display:flex;justify-content:space-between;gap:8px}
.rc-row span:last-child{white-space:nowrap;text-align:right}
.rc-tot{font-weight:800;font-size:1.15em;margin:3px 0}
.rc-sep{border-top:1px dashed #111;margin:6px 0}
#print-root{display:none}
@media print{
  html,body{height:auto;overflow:visible;background:#fff}
  body>*:not(#print-root){display:none!important}
  #print-root{display:block!important}
  #print-root .rc{padding:2mm 2mm 4mm}
}
.screen{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:24px 14px 40px}
.setup-card{position:relative;width:100%;max-width:560px;background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px 20px 22px;overflow:hidden}
.setup-card h1{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.1;margin:6px 0 8px;padding-right:44px}
.setup-card .sub{color:var(--ink-2);margin:0 0 14px}
.setup-card textarea.input{font:14px/1.4 ui-monospace,Menlo,Consolas,monospace;min-height:150px;resize:vertical}
.brand-pole{position:absolute;top:-8px;right:18px;width:26px;height:92px;border-radius:14px;background:repeating-linear-gradient(135deg,#E06A1B 0 10px,#fff 10px 20px,#1374BA 20px 30px,#fff 30px 40px);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.steps{display:flex;gap:6px;list-style:none;padding:0;margin:0 0 12px;counter-reset:st;flex-wrap:wrap}
.steps li{counter-increment:st;font-size:13px;font-weight:700;color:var(--muted);background:var(--paper-2);border-radius:99px;padding:5px 10px}
.steps li::before{content:counter(st) ". "}
.steps li.cur{background:var(--ink);color:var(--paper)}
.steps li.done{color:var(--ok);background:var(--ok-bg)}
.how{margin:0 0 12px;padding-left:22px}
.how li{margin:4px 0}
pre.rules{max-height:220px;overflow:auto;background:var(--paper-2);border-radius:10px;padding:10px;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre;margin:0 0 10px}
code{font:0.92em ui-monospace,Menlo,Consolas,monospace;background:var(--paper-2);padding:1px 5px;border-radius:5px}
.rc-sub{padding-left:10px;font-size:.94em}
.resa-row .ri-main b{white-space:normal;overflow:visible;display:block}

</style>
</head>

<div id="app"></div>
<div id="sheets"></div>
<div id="toasts" aria-live="polite"></div>

function cyrb53(str, seed = 0) {
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for (let i = 0, ch; i < str.length; i++) { ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }

  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16);
}

}

function periodRange(p) {

    const lastPrev = new Date(d.getFullYear(), d.getMonth(), 0).getDate();
    return {from: dkey(new Date(d.getFullYear(), d.getMonth(), 1)), to: t,
      prevFrom: dkey(new Date(d.getFullYear(), d.getMonth() - 1, 1)), prevTo: dkey(new Date(d.getFullYear(), d.getMonth() - 1, Math.min(d.getDate(), lastPrev))),
      label: "Ce mois-ci", vs: "par rapport au même moment le mois dernier"};

const TABS = {caisse: "Caisse", tickets: "Tickets", credits: "Crédits", agenda: "Agenda", rapports: "Rapports", gestion: "Gestion"};

/* ===================== Rendu principal ===================== */
let rafPending = false;
function render() { if (rafPending) return; rafPending = true; requestAnimationFrame(() => { rafPending = false; doRender(); }); }
function doRender() {
  const app = $("#app");
  if (S.mode !== "app") {
    const fbm = S.mode === "welcome" || S.mode.startsWith("fb");
    const key = S.mode + "|" + S.demo + (fbm ? "|" + JSON.stringify(S.fbSetup || {}) + "|" + (S.fbNote || "") + "|" + (S.fbDenied || "") : "");
    if (app.dataset.screen !== key || S.mode === "boot") { app.innerHTML = screenHTML(); app.dataset.screen = key; }
    else if (S.mode === "lock") { const d = $("#lock-dots"); if (d) d.innerHTML = dotsHTML(S.pinBuf.length); }
    return;
  }
  app.dataset.screen = "app";
  const com = curCom();
  const key = com + "|" + S.demo + "|" + comColor(com) + "|" + comColor2(com);
  let shell = $(".shell", app);
  if (!shell || shell.dataset.key !== key) {
    app.innerHTML = `<div class="shell" data-key="${esc(key)}" style="--accent:${esc(comColor(com))};--pole-a:${esc(comColor(com))};--pole-b:${esc(comColor2(com))}">${S.demo ? demoBannerHTML() : ""}<header class="topbar" id="topbar"></header><nav class="tabs" id="tabs" aria-label="Sections"></nav><main class="main" id="main"></main></div>`;
    shell = $(".shell", app);
  }
  $("#topbar").innerHTML = topbarHTML();
  $("#tabs").innerHTML = tabsHTML();
  const main = $("#main");
  const view = effView();
  const same = main.dataset.view === view;
  const keep = {};
  $$("[data-scroll]", main).forEach(el => { keep[el.dataset.scroll] = el.scrollTop; });
  const top = main.scrollTop;
  main.dataset.view = view;
  main.className = "main" + (view === "caisse" ? " is-pos" : "");
  main.innerHTML = viewHTML();
  if (same) { main.scrollTop = top; $$("[data-scroll]", main).forEach(el => { if (keep[el.dataset.scroll] != null) el.scrollTop = keep[el.dataset.scroll]; }); }
  refreshTicketSheet();
}
function screenHTML() {
  if (S.mode === "welcome" || S.mode.startsWith("fb")) return fbScreenHTML();
  if (S.mode === "boot") return `<div class="boot"><div><div class="wordmark" style="color:var(--ink)">${wordmark(S.config ? comName(coms()[0]) : APP_NAME)}</div><p>Chargement de la caisse…</p></div></div>`;
  if (S.mode === "revoked") return `<div class="boot"><div><h1 class="lock-title">Accès retiré</h1><p>Cet appareil n'a plus accès à la plateforme. Rechargez la page ou demandez l'accès au propriétaire.</p></div></div>`;
  if (S.mode === "nodb") return `<div class="lock">${brandHTML()}<section class="lock-pane"><h1 class="lock-title">Ouvrez la plateforme depuis son lien Claude</h1><p>Ici, les ventes ne peuvent pas être enregistrées. Ouvrez le lien de la plateforme dans Claude, ou essayez-la sans rien enregistrer.</p><button class="btn btn-primary btn-lg" data-act="demo-start">Découvrir en mode démo</button></section></div>`;

      : `<p>La plateforme n'est pas encore configurée. Le propriétaire doit d'abord créer le profil administrateur.</p>`}</section></div>`;

const APP_NAME = "O'Caisse";
function wordmark(name) {
  const n = String(name || "");

}
function brandHTML() {

}

const demoBannerHTML = () => `<div class="demo-banner">Mode démo : rien n'est enregistré. <button class="linkish" data-act="demo-exit">Quitter la démo</button></div>`;
function syncState() {
  if (S.demo) return {cls: "demo", txt: "Démo"};

function renderSync() { const el = $(".sync-pill"); if (el) el.outerHTML = syncPillHTML(); }

/* ===================== Caisse ===================== */
const cartTotal = () => S.cart.lines.reduce((s, l) => s + l.prix * l.qte, 0);
const cartCount = () => S.cart.lines.reduce((s, l) => s + l.qte, 0);
const needsPrest = com => comType(com) === "salon" && prestataires(com).length > 0;
function caisseHTML() {
  const com = curCom();

  if (!sess) {

      <h1>La caisse ${esc(comName(com))} est fermée</h1>

    return `<button class="tile ${a.photo ? "has-photo" : ""} ${qty[id] ? "in-cart" : ""}" data-act="add" data-id="${esc(id)}">

      </div></div>
      ${tiles ? `<div class="grid">${tiles}</div>` : `<div class="empty">Aucun article ici. ${isAdmin() ? "Ajoutez-en dans Gestion, onglet Catalogue." : "L'administrateur peut en ajouter dans Gestion."}</div>`}
    </section>

      <button class="btn pole" data-act="checkout" ${n ? "" : "disabled"}><span class="pole-label">Encaisser</span></button>
    </div>

}
function ticketPanelHTML(com) {
  const lines = S.cart.lines, tot = cartTotal();
  let who = "";
  if (comType(com) === "salon") {
    const ps = prestataires(com);
    if (ps.length) who = `<div class="tk-who"><div class="tk-label">Réalisé par</div><div class="chips">${ps.map(([id, m]) => `<button class="chip" data-act="prest" data-id="${esc(id)}" aria-pressed="${S.cart.prest === id}">${avatarHTML(id)}${esc(firstName(m.nom))}</button>`).join("")}</div></div>`;
  } else {
    who = `<div class="tk-who"><div class="chips">${Object.entries(CANAUX).map(([k, v]) => `<button class="chip" data-act="canal" data-id="${k}" aria-pressed="${S.cart.canal === k}">${v}</button>`).join("")}</div></div>`;
  }
  const items = lines.map((l, i) => `<li class="line">
      <div class="ln-name">${esc(lineName(l))}${l.libre ? `<small>Prix libre : ${F(l.prix)}</small>` : `<small>${F(l.prix)} l'unité</small>`}</div>

function refreshTicketSheet() {
  if (!S.tkSheet) return;
  if (!document.body.contains(S.tkSheet.wrap) || S.mode !== "app" || effView() !== "caisse") { S.tkSheet = null; return; }
  const el = S.tkSheet.el.querySelector(".tk-sheet-body");

function addLine(art, a, prix, opts = {}) {
  const v = opts.var || "";
  const ex = S.cart.lines.find(l => l.art === art && l.prix === prix && (l.var || "") === v && !a.libre);
  if (ex) ex.qte++;
  else S.cart.lines.push({art, nom: a.nom, var: v, prix, qte: 1, libre: !!a.libre || !(a.prix || []).length});
  if (!opts.silent) render();

/* ===================== Tickets de la session ===================== */

    ${regs.length ? `<section class="panel"><h2>Remboursements de crédit <span class="count">${regs.length}</span></h2><ul class="list">${regs.map(g => `<li><div class="row-item" style="cursor:default"><span class="ri-main"><b>${esc(g.client?.nom || "Client")}</b><span class="meta"><span>${hm(g.at)}</span><span>${esc(modeName(g.mode))}</span></span></span><span class="amt">+ ${F(g.montant)}</span></div></li>`).join("")}</ul></section>` : ""}

/* ===================== Rapports ===================== */
function barsHTML(rows, total, fmt = F) {
  return `<div class="bars">${rows.map(([label, v, color]) => `<div class="bar-row"><span class="bl" title="${esc(label)}">${esc(label)}</span><span class="bar"><i style="width:${total ? Math.max(2, (v / total) * 100) : 0}%${color ? `;background:${esc(color)}` : ""}"></i></span><span class="amt">${fmt(v)}</span></div>`).join("")}</div>`;
}
function rapportsHTML() {
  const range = periodRange(S.rep.period);
  const all = coms();
  if (!isAdmin()) S.rep.com = curCom();
  if (S.rep.com !== "all" && !all.includes(S.rep.com)) S.rep.com = "all";
  const comF = isAdmin() ? S.rep.com : curCom();
  const periods = [["today", "Aujourd'hui"], ["yesterday", "Hier"], ["7d", "7 jours"], ["month", "Ce mois"], ["lastmonth", "Mois dernier"]];
  const filters = `<div class="rep-filters" style="margin-bottom:12px"><div class="seg" role="group" aria-label="Période">${periods.map(([k, v]) => `<button data-act="rep-period" data-p="${k}" aria-pressed="${S.rep.period === k}">${v}</button>`).join("")}</div>
    ${isAdmin() && all.length > 1 ? `<div class="seg" role="group" aria-label="Activité">${[["all", "Tout"], ...all.map(k => [k, comName(k)])].map(([k, v]) => `<button data-act="rep-com" data-c="${esc(k)}" aria-pressed="${S.rep.com === k}">${esc(v)}</button>`).join("")}</div>` : ""}</div>`;
  const when = range.from === range.to ? dLabel(range.from) : `du ${dLabel(range.from)} au ${dLabel(range.to)}`;
  const head = `<div class="page-head"><div><h1>Rapports${comF === "all" ? "" : " " + esc(comName(comF))}</h1><p class="muted">${esc(when)}</p></div><button class="btn" data-act="export-csv">Exporter les ventes (Excel)</button></div>`;
  if (!S.rep.raw) return `<div class="page">${head}${filters}<div class="panel empty">Chargement des chiffres…</div></div>`;
  const {cur, prev} = computeReport(S.rep.raw, range, comF);
  const delta = prev.ca > 0 ? Math.round(((cur.ca - prev.ca) / prev.ca) * 100) : null;
  const deltaHTML = delta === null ? `<span class="delta">Pas encore de chiffre à comparer</span>`
    : `<span class="delta ${delta >= 0 ? "up" : "down"}">${delta >= 0 ? "+" : "−"}${Math.abs(delta)} % ${esc(range.vs)}</span>`;

async function exportCSV() {
  const range = periodRange(S.rep.period);
  const comF = isAdmin() ? S.rep.com : curCom();
  const rows = [];
  for (const s of S.rep.raw || []) {
    if (comF !== "all" && s.commerce !== comF) continue;
    for (const t of Object.values(s.tickets || {})) {
      if (!inRange(t.d, range.from, range.to)) continue;
      rows.push([t.d, hm(t.at), comName(s.commerce), t.n, (t.lignes || []).map(l => `${l.qte} x ${lineName(l)} (${l.prix})`).join(" + "), mName(t.prest), mName(t.par), modeName(t.mode), t.total, t.remise || 0, t.net, t.statut === "annule" ? "Annulé" : "Validé", t.client?.nom || "", t.client?.tel || "", t.source || "", CANAUX[t.canal] || ""]);
    }
  }
  if (!rows.length) { toast("Aucune vente à exporter sur cette période.", "warn"); return; }
  rows.sort((a, b) => (a[0] + a[1]).localeCompare(b[0] + b[1]));
  const head = ["Date", "Heure", "Activité", "N° ticket", "Articles", "Réalisé par", "Caissier", "Mode de paiement", "Total", "Remise", "Net", "Statut", "Client", "Téléphone", "Source", "Service"];
  const cell = v => { const s = String(v ?? ""); return /[";\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const csv = "\uFEFF" + [head, ...rows].map(r => r.map(cell).join(";")).join("\r\n");
  const filename = `ventes_${comF === "all" ? "tout" : slug(comName(comF))}_${range.from}_${range.to}.csv`;
  if (!S.downloads) { saveFileLocal(filename, csv, "text/csv;charset=utf-8"); return; }
  try { await S.downloads.save({filename, data: csv}); toast("Fichier enregistré"); }
  catch (e) {
    if (e && e.code === "declined") return;
    toast(e && e.code === "extension_not_enabled" ? "Les fichiers Excel ne peuvent pas être téléchargés ici." : "L'export a échoué. Réessayez.", "bad");
  }
}

function slug(v) { return String(v || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "x"; }
function saveFileLocal(filename, data, type) {
  try {
    const url = URL.createObjectURL(new Blob([data], {type}));
    const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000); toast("Fichier téléchargé");
  } catch (e) { toast("Le téléchargement a échoué.", "bad"); }
}

function openSheet({html, actions = {}, onMount, onClose, wide = false, dismissable = true}) {
  const wrap = document.createElement("div");
  wrap.className = "sheet-wrap";
  wrap.innerHTML = `<div class="sheet ${wide ? "wide" : ""}" role="dialog" aria-modal="true">${html}</div>`;
  const el = wrap.firstElementChild;
  let closed = false;
  const api = {wrap, el, actions, dismissable, close() { if (closed) return; closed = true; wrap.remove(); if (onClose) onClose(api); }, isClosed: () => closed};
  wrap._api = api;
  wrap.addEventListener("click", e => { if (e.target === wrap && api.dismissable) api.close(); });
  $("#sheets").appendChild(wrap);
  if (onMount) onMount(api);
  const f = el.querySelector("[autofocus]");
  if (f) setTimeout(() => { try { f.focus(); } catch (e) {} }, 60);
  return api;
}
const topSheet = () => { const w = $$("#sheets .sheet-wrap"); return w.length ? w[w.length - 1]._api : null; };

}

  const remise = Math.min(pay.remise || 0, total);
  const n = Object.keys(sess.tickets || {}).length + 1;
  const id = uid("t");
  const t = {id, n, at: now.toISOString(), d: dkey(now), h: now.getHours(), par: S.op, compte: S.me.id || null, lignes, total, remise, net: total - remise,

    client: pay.client || null, source: pay.source || null, remiseBy: remise ? pay.remiseBy || S.op : null, statut: "ok", resa: custom && custom.resa ? custom.resa : null};

  if (custom && custom.resa) OB.push(`reservations/${custom.resa}`, "update", {paiements: {[id]: {montant: t.net, mode: t.mode, at: t.at, ticket: id, n, session: sess.id, par: S.op, type: custom.type || "acompte"}}});
  if (!custom) S.carts[com] = {lines: [], prest: null, canal: cart.canal || "place"};

}

async function downscale(file, max, quality = 0.82) {
  const dataUrl = await blobToDataURL(file);
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = dataUrl; });
  const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.max(1, Math.round(img.naturalWidth * k)), h = Math.max(1, Math.round(img.naturalHeight * k));
  const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
  cv.getContext("2d").drawImage(img, 0, 0, w, h);
  return new Promise(res => cv.toBlob(b => res(b), "image/jpeg", quality));
}
function blobToDataURL(b) { return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(b); }); }

function parseVariants(txt) {
  const out = [];
  for (const part of String(txt || "").split(/[;,\n]+/)) {
    const p = part.trim(); if (!p) continue;
    const m = p.match(/^(.*?)[=:]\s*([\d\s\u00a0\u202f.]+)\s*(?:f|fcfa)?\s*$/i);
    if (m && m[1].trim()) out.push({lib: m[1].trim(), prix: intOf(m[2])});
    else out.push({lib: "", prix: intOf(p)});
  }
  const seen = new Set();
  return out.filter(v => v.prix > 0 && !seen.has(v.lib + "|" + v.prix) && seen.add(v.lib + "|" + v.prix));
}

/* ===================== Verrouillage ===================== */
async function lockKey(k) {
  if (S.mode !== "lock" || S.pinBusy) return;
  if (Date.now() < S.pinLockUntil) { toast("Patientez quelques secondes.", "warn"); return; }
  if (S.pinBuf.length >= 4) return;
  S.pinBuf += k; updLockDots();
  if (S.pinBuf.length < 4) return;
  S.pinBusy = true;
  const id = await findMemberByPin(S.pinBuf);
  S.pinBusy = false;
  if (id) { S.pinFails = 0; login(id); return; }
  S.pinFails++; S.pinBuf = ""; updLockDots(); shakeEl($("#lock-dots"));
  if (S.pinFails >= 5) { S.pinFails = 0; S.pinLockUntil = Date.now() + 30000; toast("Trop d'essais. Réessayez dans 30 secondes.", "bad"); }
  else toast("Code incorrect", "bad");
}
function updLockDots() { const d = $("#lock-dots"); if (d) d.innerHTML = dotsHTML(S.pinBuf.length); }
function persistOp(force) {
  if (S.demo || !S.op) return;
  const now = Date.now();
  if (!force && now - S.lastPersist < 15000) return;
  S.lastPersist = now; ls.set("oth.op", {id: S.op, at: now});
}
function login(id) {
  S.op = id; S.mode = "app"; S.pinBuf = ""; S.lastActivity = Date.now();
  const m = S.membres[id];
  if (m && m.commerce && m.commerce !== "tous") S.com = m.commerce;
  S.view = "caisse"; S.cat = "all";
  persistOp(true); render();
}
function lock() { closeAllSheets(); S.op = null; S.mode = "lock"; S.pinBuf = ""; ls.del("oth.op"); render(); }

function printPrefs() {

const dateFr = iso => { const d = new Date(iso); return `${pad2(d.getDate())}/${pad2(d.getMonth() + 1)}/${d.getFullYear()} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
function waNumber(tel) {
  let d = String(tel || "").replace(/\D/g, "");
  if (d.startsWith("00")) d = d.slice(2);
  if (d.length === 8) d = "223" + d;
  return d.length >= 8 ? d : "";
}
function waLink(tel, text) { const n = waNumber(tel); return `https://wa.me/${n}?text=${encodeURIComponent(text)}`; }
function openExternal(url) {
  try { const w = window.open(url, "_blank", "noopener"); if (!w) location.href = url; }
  catch (e) { location.href = url; }
}
async function shareText(title, text, tel) {
  if (waNumber(tel)) { openExternal(waLink(tel, text)); return; }
  if (navigator.share) {
    try { await navigator.share({title, text}); return; }
    catch (e) { if (e && e.name === "AbortError") return; }
  }
  openExternal(waLink("", text));
}

  for (const t of Object.values(s.tickets || {})) {
    if (t.statut === "annule") continue;
    if (t.prest) { const p = prest[t.prest] || (prest[t.prest] = {n: 0, ca: 0}); p.n++; p.ca += t.net || 0; }
    for (const l of t.lignes || []) { const a = arts[l.art] || (arts[l.art] = {nom: l.nom, qte: 0, ca: 0}); a.qte += l.qte || 0; a.ca += (l.prix || 0) * (l.qte || 0); }

}

  for (const [k, v] of Object.entries(c.byMode).sort((a, b) => b[1] - a[1])) R.push(["kv", "  " + modeName(k), F(v)]);
  if (c.rembTotal) R.push(["kv", "Remboursements de crédit", F(c.rembTotal)]);
  if (deps.length) { R.push(["kv", "Dépenses", "− " + F(c.depenses)]); for (const d of deps) R.push(["kv", "  " + d.cat + (d.note ? " (" + d.note + ")" : ""), F(d.montant)]); }
  R.push(["sep"]);
  R.push(["kv", "Fond de caisse", F(c.fond)]);
  if (full) {
    R.push(["kv", "Espèces attendues", F(cl.attendu ?? c.cashExpected)]);
    if (cl.at) {
      R.push(["kv", "Espèces comptées", F(cl.compte)]);
      const e = cl.ecart || 0;
      R.push(["kvb", "Écart", e === 0 ? "Aucun" : (e > 0 ? "+ " : "− ") + F(Math.abs(e))]);
    }
  } else if (cl.at) R.push(["kv", "Espèces comptées", F(cl.compte)]);

  if (pr.length) {
    R.push(["sep"]); R.push(["h2", "Coiffeurs"]);
    for (const [id, p] of pr.sort((a, b) => b[1].ca - a[1].ca)) {
      const m = S.membres[id] || {}; const pct = m.commission || 0;
      R.push(["kv", `${firstName(m.nom || "?")} · ${p.n} client${p.n > 1 ? "s" : ""}`, F(p.ca) + (pct ? ` (${F(Math.round(p.ca * pct / 100))} à verser)` : "")]);

  if (cl.note) { R.push(["sep"]); R.push(["t", "Remarque : " + cl.note]); }
  return R;

function resaConflicts(r, exceptId) {

  const a1 = toMin(r.debut), a2 = r.fin ? toMin(r.fin) : a1 + 60;
  return S.resas.filter(x => x.id !== exceptId && x.statut !== "annulee" && x.commerce === r.commerce && x.date === r.date && (x.art || x.nom) === (r.art || r.nom))

}

/* ===================== Base Firebase (version indépendante) ===================== */
const FB_KEY = "oc.firebase";
const fbConfLoad = () => ls.get(FB_KEY, null);
const fbConfSave = c => ls.set(FB_KEY, c);
const b64u = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const unb64u = s => decodeURIComponent(escape(atob(s.replace(/-/g, "+").replace(/_/g, "/"))));
function parseFbConfig(txt) {
  const t = String(txt || "");
  const pick = k => { const m = t.match(new RegExp("[\"']?" + k + "[\"']?\\s*:\\s*[\"']([^\"']+)[\"']")); return m ? m[1].trim() : ""; };
  const c = {apiKey: pick("apiKey"), authDomain: pick("authDomain"), projectId: pick("projectId"), storageBucket: pick("storageBucket"), messagingSenderId: pick("messagingSenderId"), appId: pick("appId")};
  if (!c.apiKey || !c.projectId || !c.appId) return null;
  if (!c.authDomain) c.authDomain = c.projectId + ".firebaseapp.com";
  return c;
}
function readInstallHash() {
  const m = String(location.hash || "").match(/installer=([A-Za-z0-9_-]+)/);
  if (!m) return null;
  try { const p = JSON.parse(unb64u(m[1])); if (p && p.c && p.c.apiKey && p.c.projectId && p.c.appId) return p.c; } catch (e) {}
  return null;
}
function installLink() {
  const c = S.fb.conf;
  const conf = {apiKey: c.apiKey, authDomain: c.authDomain, projectId: c.projectId, storageBucket: c.storageBucket || "", messagingSenderId: c.messagingSenderId || "", appId: c.appId};

function makeFirebaseDB(fs) {
  const F = window.OFirebase;
  const wrapDoc = s => ({id: s.id, exists: s.exists(), data: () => s.data(), metadata: s.metadata});
  const wrapQ = q => ({docs: q.docs.map(d => ({id: d.id, data: () => d.data()})), size: q.size, empty: q.empty, metadata: q.metadata});
  class DocRef {
    constructor(path) { this.path = path; this.id = path.split("/").pop(); this.ref = F.doc(fs, path); }
    get() { return F.getDoc(this.ref).then(wrapDoc, e => { throw fbErr(e); }); }
    set(data) { return F.setDoc(this.ref, data).catch(e => { throw fbErr(e); }); }
    update(data) { return F.setDoc(this.ref, data, {merge: true}).catch(e => { throw fbErr(e); }); }
    delete() { return F.deleteDoc(this.ref).catch(e => { throw fbErr(e); }); }
    onSnapshot(next, err) { return F.onSnapshot(this.ref, s => next(wrapDoc(s)), e => err && err(fbErr(e))); }
  }
  class Query {
    constructor(path, cons) { this.path = path; this.cons = cons || []; }
    doc(id) { return new DocRef(this.path + "/" + id); }
    where(f, op, v) { return new Query(this.path, [...this.cons, F.where(f, op, v)]); }
    orderBy(f, d) { return new Query(this.path, [...this.cons, F.orderBy(f, d || "asc")]); }
    limit(n) { return new Query(this.path, [...this.cons, F.limit(n)]); }
    q() { return F.query(F.collection(fs, this.path), ...this.cons); }
    get() { return F.getDocs(this.q()).then(wrapQ, e => { throw fbErr(e); }); }
    onSnapshot(next, err) { return F.onSnapshot(this.q(), q => next(wrapQ(q)), e => err && err(fbErr(e))); }
  }
  return {doc: p => new DocRef(p), collection: p => new Query(p)};
}

  const F = window.OFirebase;
  ls.set("oth.op", null);
  fbStopData(); fbStopRole();
  try { await F.signOut(S.fb.auth); } catch (e) {}
  S.mode = "fblogin"; render();
}
function fbCopy(text, okMsg) {
  const done = () => toast(okMsg || "Copié");
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => fallback());
  else fallback();
  function fallback() {
    const ta = document.createElement("textarea"); ta.value = text; ta.style.cssText = "position:fixed;left:-9999px"; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch (e) { toast("Copie impossible : sélectionnez le texte à la main.", "warn"); }
    ta.remove();
  }
}

/* ----- Gestion > Appareils ----- */
function appareilsHTML() {
  const list = Object.entries(S.fbDevices || {}).sort((a, b) => String(a[1].nom).localeCompare(String(b[1].nom), "fr"));
  return `<div class="cols">
    <section class="panel"><div class="panel-head"><h2>Appareils de la boutique</h2><button class="linkish" data-act="dev-new">Ajouter un appareil</button></div>

        : `<p class="muted">Aucun appareil pour l'instant. Ajoutez la tablette du salon, le téléphone du snack…</p>`}
      <p class="muted" style="margin:8px 0 0">Un appareil perdu ou volé : désactivez-le, il perd l'accès immédiatement.</p></section>
    <section class="panel"><h2>Lien d'installation</h2><p class="muted" style="margin:6px 0 12px">Ouvrez ce lien sur le nouvel appareil (Chrome sur Android), puis connectez-le avec son identifiant et son mot de passe.</p>
      <div class="chips"><button class="btn" data-act="link-copy">Copier le lien</button><button class="btn" data-act="link-wa">Envoyer par WhatsApp</button></div>
      <p class="muted" style="margin:12px 0 0">Ensuite, dans le menu de Chrome : « Ajouter à l'écran d'accueil ». L'application s'ouvre alors comme une vraie application, même sans réseau.</p></section>
    <section class="panel"><h2>Compte propriétaire</h2><div class="kv"><span>E-mail</span><b>${esc(S.fb && S.fb.user ? S.fb.user.email : "")}</b></div><div class="kv"><span>Projet Firebase</span><b>${esc(S.fb ? S.fb.conf.projectId : "")}</b></div></section>
  </div>`;
}
function genPassword() { const a = "abcdefghjkmnpqrstuvwxyz23456789"; let s = ""; const r = crypto.getRandomValues(new Uint32Array(8)); for (const x of r) s += a[x % a.length]; return s; }
function openDeviceEditor() {
  const st = {pw: genPassword()};
  const sh = openSheet({
    html: `<h2>Ajouter un appareil</h2><p class="sub">Chaque tablette ou téléphone de la boutique a son propre compte.</p>
      <div class="field"><label for="dv-n">Nom de l'appareil</label><input id="dv-n" class="input" autocomplete="off" placeholder="Ex. : Tablette du salon"></div>
      <div class="two"><div class="field"><label for="dv-i">Identifiant</label><input id="dv-i" class="input" autocomplete="off" autocapitalize="off" placeholder="Ex. : salon"></div>
      <div class="field"><label for="dv-p">Mot de passe</label><input id="dv-p" class="input" autocomplete="off" autocapitalize="off" value="${esc(st.pw)}"></div></div>
      <p class="form-err" id="dv-err" role="alert"></p>
      <div class="sheet-actions"><button class="btn" data-act="close">Annuler</button><button class="btn btn-primary grow" data-act="ok">Créer l'appareil</button></div>`,
    actions: {
      close: () => sh.close(),
      ok: async t => {
        const err = $("#dv-err", sh.el); err.textContent = "";
        const nom = $("#dv-n", sh.el).value.trim(); const ident = slug($("#dv-i", sh.el).value.trim() || nom); const pw = $("#dv-p", sh.el).value.trim();
        if (!nom) { err.textContent = "Donnez un nom à l'appareil."; return; }
        if (pw.length < 6) { err.textContent = "Mot de passe : 6 caractères au minimum."; return; }
        t.disabled = true; t.textContent = "Création…";
        try {
          const r = await fbCreateDevice(nom, ident, pw);
          sh.close(); openDeviceCreated(nom, ident, pw, r);
        } catch (e) { t.disabled = false; t.textContent = "Créer l'appareil"; err.textContent = fbMsg(e.fb ? e : fbErr(e)).replace("Ce compte existe déjà : touchez « J'ai déjà créé ce compte ».", "Cet identifiant est déjà pris : choisissez-en un autre."); }
      }
    }
  });
  enterSubmits(sh, "ok");
}
async function fbCreateDevice(nom, ident, pw) {
  const F = window.OFirebase, fb = S.fb;
  const email = identToEmail(ident);
  const sec = F.initializeApp(fb.conf, "oc-sec-" + Date.now());
  let uid2;
  try {
    const auth2 = F.initializeAuth(sec, {persistence: F.inMemoryPersistence});
    const cred = await withTimeout(F.createUserWithEmailAndPassword(auth2, email, pw), 20000);
    uid2 = cred.user.uid;
    await F.signOut(auth2).catch(() => {});
  } finally { F.deleteApp(sec).catch(() => {}); }
  await withTimeout(F.setDoc(F.doc(fb.fs, "appareils/" + uid2), {nom, ident, email, actif: true, cree: {at: new Date().toISOString(), par: S.op}}), 20000);
  return {uid: uid2, email};
}
function openDeviceCreated(nom, ident, pw) {
  const sh = openSheet({
    html: `<div class="success"><div class="ok-mark" aria-hidden="true">✓</div><h2>${esc(nom)} est prêt</h2></div>
      <div class="kv"><span>Identifiant</span><b>${esc(ident)}</b></div><div class="kv"><span>Mot de passe</span><b>${esc(pw)}</b></div>
      <p class="notice info">Notez ces deux informations. Sur l'appareil : ouvrez le lien d'installation, puis connectez-vous avec cet identifiant et ce mot de passe. Il reste connecté ensuite ; chacun encaisse avec son code à 4 chiffres.</p>
      <div class="chips"><button class="btn" data-act="wa">Envoyer le lien par WhatsApp</button><button class="btn" data-act="copy">Copier le lien</button></div>
      <div class="sheet-actions"><button class="btn btn-primary btn-block" data-act="close">Terminé</button></div>`,
    actions: {close: () => sh.close(), wa: () => openExternal(waLink("", `Installation de la caisse sur « ${nom} » : ouvrez ce lien avec Chrome, puis connectez-vous avec l'identifiant ${ident}.\n${installLink()}`)), copy: () => fbCopy(installLink(), "Lien copié")}
  });
}
Object.assign(A, {

  "fb-rules-copy": () => fbCopy(FIRESTORE_RULES, "Règles copiées : collez-les dans la console Firebase"),

  "fb-reset-pwd": async () => {
    const em = await askText("Adresse e-mail du propriétaire", "vous@exemple.com", []); if (!em) return;

  "fb-change-base": () => {

    });
  },
  "fb-signout": () => {

      html: `<h2>Déconnecter cet appareil ?</h2><p class="sub">Il faudra se reconnecter avec l'identifiant et le mot de passe de l'appareil.${OB.pending() ? ` Attention : ${OB.pending()} envoi(s) sont encore en attente.` : ""}</p><div class="sheet-actions"><button class="btn" data-act="close">Annuler</button><button class="btn btn-danger grow" data-act="ok">Déconnecter</button></div>`,
      actions: {close: () => sh.close(), ok: () => { sh.close(); fbSignOut(); }}
    });
  },
  "fb-signout-now": () => fbSignOut(),
  "dev-new": () => openDeviceEditor(),
  "dev-toggle": t => {
    const d = (S.fbDevices || {})[t.dataset.id]; if (!d) return;
    window.OFirebase.setDoc(window.OFirebase.doc(S.fb.fs, "appareils/" + t.dataset.id), {actif: !d.actif}, {merge: true}).catch(e => toast(fbMsg(fbErr(e)), "bad"));
    toast(d.actif ? `${d.nom} est désactivé` : `${d.nom} est de nouveau autorisé`);
  },
  "link-copy": () => fbCopy(installLink(), "Lien copié"),
  "link-wa": () => openExternal(waLink("", `Installation de la caisse : ouvrez ce lien avec Chrome sur l'appareil de la boutique.\n${installLink()}`))
});

/* ----- Application installable (PWA) ----- */
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); S.installPrompt = e; });
window.addEventListener("appinstalled", () => { S.installPrompt = null; toast("Application installée"); });
async function promptInstall() {
  const p = S.installPrompt;
  if (!p) { toast("Dans le menu du navigateur, choisissez « Ajouter à l'écran d'accueil ».", "warn"); return; }
  p.prompt();
  try { await p.userChoice; } catch (e) {}
  S.installPrompt = null;
}
function registerSW() {
  if (!("serviceWorker" in navigator) || !/^https?:$/.test(location.protocol) || window.claude) return;
  if (!document.querySelector('link[rel="manifest"]')) return;
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

/* ===================== Démarrage ===================== */
function resetUi() { S.op = null; S.pinBuf = ""; S.cat = "all"; S.view = "caisse"; S.carts = {}; S.rep.period = "today"; S.rep.com = "all"; S.catalogCom = null; }
async function boot() {
  S.mode = "boot"; render();
  const c = window.claude;
  if (c && typeof c.use === "function") {
    const get = n => Promise.resolve().then(() => c.use(n)).catch(() => null);
    const [db, user, assets, downloads] = await Promise.all([get("db"), get("user"), get("assets"), get("downloads")]);
    S.cap = {db, user, assets, downloads};
    if (db) { await startClaude(); return; }
  }
  registerSW();
  const fromLink = readInstallHash();
  if (fromLink) {
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
    const cur = fbConfLoad();
    fbConfSave(fromLink);
    if (!cur || cur.projectId !== fromLink.projectId) setTimeout(() => toast("Base de la boutique enregistrée sur cet appareil"), 400);
  }
  const conf = fbConfLoad();
  if (conf) { startFirebase(conf); return; }
  S.backend = null; S.mode = "welcome"; render();
}
async function startClaude() {
  closeAllSheets(); unsubAll();
  S.backend = "claude"; S.demo = false;
  S.db = S.cap.db; S.user = S.cap.user; S.assets = S.cap.assets; S.downloads = S.cap.downloads;
  S.me = {id: null, isOwner: false, canEdit: false, canWrite: null};
  if (S.user) {
    try { const me = await S.user.me(); S.me = {id: me.id || null, isOwner: !!me.isOwner, canEdit: !!me.canEdit, canWrite: null}; S.me.canWrite = await S.user.can("data.write"); } catch (e) {}
  }
  resetUi(); S.mode = "boot";
  OB.load(); subscribeAll(); refreshDerived(); render(); OB.run();
}
async function startDemo() {
  closeAllSheets(); unsubAll();
  if (S.fb) { fbStopData(); fbStopRole(); }
  S.demo = true; S.backend = "demo"; S.mode = "boot"; S.db = null; render();
  const db = new MockDB();
  await demoSeed(db);
  S.db = db; S.user = null; S.assets = null; S.downloads = S.cap ? S.cap.downloads : null;
  S.me = {id: "demo", isOwner: true, canEdit: true, canWrite: true};
  resetUi(); OB.ops = []; S.photos = {};
  subscribeAll(); render();
}
function exitDemo() {
  closeAllSheets(); unsubAll(); S.demo = false; S.db = null; OB.ops = [];
  if (S.cap && S.cap.db) { startClaude(); return; }
  const conf = fbConfLoad();
  if (conf) {
    S.backend = "firebase";
    if (S.fb && S.fb.user) { S.mode = "fbwait"; render(); fbWatchRole(S.fb.user); return; }
    if (S.fb) { S.mode = "fblogin"; render(); return; }
    startFirebase(conf); return;
  }
  S.backend = null; S.mode = "welcome"; render();
}
if (/[?&]debug\b/.test(location.search)) window.__OC = {S, OB};
boot();

})();
